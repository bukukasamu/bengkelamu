<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Akun Saya — Dayah Babussa'adah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pemuat" id="pemuat"><div class="wadah"><img src="icons/logo-dayah.png" alt=""></div><small>Memuat...</small></div>
  <header id="navbar"></header>
  <main style="max-width:560px">
    <h1>Akun Saya</h1>
    <div class="card">
      <table class="kartu-hp"><tbody>
        <tr><td data-label="Nama" id="aNama"></td></tr>
        <tr><td data-label="Username" id="aUser"></td></tr>
        <tr><td data-label="Peran" id="aPeran"></td></tr>
      </tbody></table>
    </div>
    <div class="card">
      <h2>Ganti kata sandi</h2>
      <form id="formSandi">
        <div class="field"><label>Kata sandi lama</label><input type="password" name="lama" required autocomplete="current-password"></div>
        <div class="field"><label>Kata sandi baru (min. 6 karakter)</label><input type="password" name="baru" minlength="6" required autocomplete="new-password"></div>
        <div class="field"><label>Ulangi kata sandi baru</label><input type="password" name="baru2" minlength="6" required autocomplete="new-password"></div>
        <button class="btn" type="submit" id="btnSandi">Simpan Kata Sandi</button>
      </form>
    </div>
    <div class="card">
      <h2>Aplikasi</h2>
      <p class="kecil muted">Pasang aplikasi agar bisa dibuka dari layar utama HP / laptop seperti aplikasi biasa.</p>
      <div class="aksi">
        <button class="btn btn-emas tombol-pasang" id="btnPasang" hidden>⬇ Pasang aplikasi</button>
        <button class="btn btn-sec" id="btnNotif">🔔 Aktifkan notifikasi</button>
        <a class="btn btn-sec" href="panduan.html">❓ Panduan</a>
      </div>
      <p class="kecil muted" id="infoVersi"></p>
    </div>
  </main>
  <script type="module" src="js/akun.js"></script>
</body>
</html>
